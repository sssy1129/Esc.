<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Esc.">
    <title>Esc</title>
    
    <link rel="apple-touch-icon" href="Esc.-icon.jpg">
    <link rel="icon" type="image/jpeg" href="Esc.-icon.jpg">
    
    <!-- D3.js and TopoJSON for detailed world map rendering -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>

    <style>
        :root {
            --bg-color: #2C3E50;
            --text-color: #FFFFFF;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* View Containers */
        .view-container {
            display: flex;
            width: 200vw;
            height: 100vh;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .view {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Main Screen */
        .header {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-align: center;
            opacity: 0.9;
            margin-top: 20px;
        }

        .main-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .count {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 30px;
        }

        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 60px;
        }

        button {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.9);
            opacity: 0.5;
        }

        .btn-small { width: 50px; height: 50px; font-size: 1.5rem; }
        .btn-large { width: 90px; height: 90px; font-size: 2.5rem; font-weight: bold; }

        .nav-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.7;
            border-radius: 0;
            width: auto;
            height: auto;
        }
        
        .nav-btn.left {
            right: auto;
            left: 30px;
        }

        /* Lifetime Screen */
        .stats-box {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid var(--text-color);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value { font-size: 2rem; font-weight: bold; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; margin-top: 5px; }

        /* Map Container */
        .map-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
        }

        svg#world-map {
            width: 100%;
            height: 100%;
            max-height: 350px;
        }

        /* Country Map Paths */
        .map-region {
            fill: transparent;
            stroke: var(--text-color);
            stroke-width: 0.4;
            opacity: 0.15;
            transition: fill 0.8s ease, opacity 0.8s ease;
        }

        .map-region.unlocked {
            fill: var(--text-color);
            opacity: 0.9;
            stroke-width: 0.6;
        }

        /* Settings */
        .settings-container {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 40px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .setting-row:last-child { margin-bottom: 0; }

        .color-picker-wrapper {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--text-color);
            position: relative;
        }

        input[type="color"] {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 50px;
            height: 50px;
            border: none;
            padding: 0;
            background: none;
        }

        .time-picker {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="view-container" id="viewContainer">
        <!-- Main Screen -->
        <div class="view">
            <div class="header">I DON'T WANT TO BE HERE!!!</div>
            <div class="main-display">
                <div class="count" id="dailyDisplay">0</div>
            </div>
            <div class="actions">
                <button class="btn-small" onclick="updateCount(-1)">-</button>
                <button class="btn-large" onclick="updateCount(1)">+1</button>
                <button class="btn-small" style="font-size: 1.2rem;" onclick="resetCount()">↺</button>
            </div>
            <button class="nav-btn" onclick="switchView(1)">🗺️</button>
        </div>

        <!-- Lifetime & Map Screen -->
        <div class="view">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-value" id="totalEscapes">0</div>
                    <div class="stat-label">Total Escapes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalFund">$0</div>
                    <div class="stat-label">Total Fund</div>
                </div>
            </div>

            <!-- Detailed Country Map (D3 Injection) -->
            <div class="map-container">
                <svg id="world-map" viewBox="0 0 800 400"></svg>
            </div>

            <div class="settings-container">
                <div class="setting-row">
                    <span>Background Color</span>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bgColorPicker" onchange="updateColors()">
                    </div>
                </div>
                <div class="setting-row">
                    <span>Text & Accent Color</span>
                    <div class="color-picker-wrapper">
                        <input type="color" id="textColorPicker" onchange="updateColors()">
                    </div>
                </div>
                <div class="setting-row">
                    <span>Daily Reminder</span>
                    <div>
                        <input type="time" id="reminderTime" class="time-picker" value="23:00" onchange="updateReminder()">
                        <button style="display:inline-block; border-radius:15px; padding: 5px 15px; width:auto; height:auto; font-size:0.8rem; margin-left:10px;" onclick="requestNotification()">Enable</button>
                    </div>
                </div>
            </div>

            <button class="nav-btn left" onclick="switchView(0)">🤯</button>
        </div>
    </div>

    <script>
        // Data Initialization
        let dailyCount = parseInt(localStorage.getItem('dailyCount')) || 0;
        let lifetimeCount = parseInt(localStorage.getItem('lifetimeCount')) || 0;
        let unlockedRegions = JSON.parse(localStorage.getItem('unlockedRegions')) || [];
        
        let bgColor = localStorage.getItem('bgColor') || '#2C3E50';
        let textColor = localStorage.getItem('textColor') || '#FFFFFF';
        let reminderTime = localStorage.getItem('reminderTime') || '23:00';

        const UNLOCK_THRESHOLD = 50; // Unlocks a country every 50 clicks
        let allCountryIds = []; // Will be populated dynamically by D3

        const dailyDisplay = document.getElementById('dailyDisplay');
        const totalEscapes = document.getElementById('totalEscapes');
        const totalFund = document.getElementById('totalFund');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const textColorPicker = document.getElementById('textColorPicker');
        const timePicker = document.getElementById('reminderTime');

        function init() {
            dailyDisplay.innerText = dailyCount;
            totalEscapes.innerText = lifetimeCount;
            totalFund.innerText = '$' + (lifetimeCount * 10);
            
            bgColorPicker.value = bgColor;
            textColorPicker.value = textColor;
            timePicker.value = reminderTime;
            
            applyColors();
            initMap();
        }

        // Map Fetch & Render Logic
        function initMap() {
            const svg = d3.select("#world-map");
            
            // Prevent fetching multiple times if already loaded
            if (allCountryIds.length > 0) {
                renderMap();
                return;
            }

            // Using Natural Earth projection for an aesthetically pleasing world view
            const projection = d3.geoNaturalEarth1().scale(150).translate([400, 200]);
            const path = d3.geoPath().projection(projection);

            // Fetch topographical country data (110m resolution for fast loading)
            fetch('https://unpkg.com/world-atlas@2.0.2/countries-110m.json')
                .then(response => response.json())
                .then(world => {
                    const countries = topojson.feature(world, world.objects.countries).features;
                    
                    // Filter out Antarctica (ID 010) for better centering and empty areas
                    const filteredCountries = countries.filter(d => d.id !== "010");
                    
                    allCountryIds = filteredCountries.map(c => 'country-' + c.id);
                    
                    svg.selectAll("path")
                        .data(filteredCountries)
                        .enter().append("path")
                        .attr("d", path)
                        .attr("class", "map-region")
                        .attr("id", d => "country-" + d.id);
                    
                    // Initial render and catch up on unlocks
                    checkUnlock();
                    renderMap();
                })
                .catch(err => console.log("Map loading error: ", err));
        }

        function updateCount(change) {
            if (dailyCount + change >= 0) {
                dailyCount += change;
                lifetimeCount += change;
                
                localStorage.setItem('dailyCount', dailyCount);
                localStorage.setItem('lifetimeCount', lifetimeCount);
                
                checkUnlock();
                
                dailyDisplay.innerText = dailyCount;
                totalEscapes.innerText = lifetimeCount;
                totalFund.innerText = '$' + (lifetimeCount * 10);
            }
        }

        function resetCount() {
            if (dailyCount > 0) {
                if (confirm("Did you put the coins in your piggy bank today?")) {
                    dailyCount = 0;
                    localStorage.setItem('dailyCount', dailyCount);
                    dailyDisplay.innerText = dailyCount;
                }
            }
        }

        function updateColors() {
            bgColor = bgColorPicker.value;
            textColor = textColorPicker.value;
            localStorage.setItem('bgColor', bgColor);
            localStorage.setItem('textColor', textColor);
            applyColors();
        }

        function applyColors() {
            document.documentElement.style.setProperty('--bg-color', bgColor);
            document.documentElement.style.setProperty('--text-color', textColor);
        }

        function checkUnlock() {
            if (allCountryIds.length === 0) return; // Wait until map is loaded

            const targetUnlocks = Math.floor(lifetimeCount / UNLOCK_THRESHOLD);
            let newlyUnlocked = false;

            // Loop to catch up if user unlocked multiple at once
            while (targetUnlocks > unlockedRegions.length && unlockedRegions.length < allCountryIds.length) {
                const locked = allCountryIds.filter(id => !unlockedRegions.includes(id));
                if (locked.length > 0) {
                    const randomRegion = locked[Math.floor(Math.random() * locked.length)];
                    unlockedRegions.push(randomRegion);
                    newlyUnlocked = true;
                } else {
                    break;
                }
            }

            if (newlyUnlocked) {
                localStorage.setItem('unlockedRegions', JSON.stringify(unlockedRegions));
                renderMap();
            }
        }

        function renderMap() {
            allCountryIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (unlockedRegions.includes(id)) {
                        el.classList.add('unlocked');
                    } else {
                        el.classList.remove('unlocked');
                    }
                }
            });
        }

        function switchView(index) {
            document.getElementById('viewContainer').style.transform = `translateX(-${index * 100}vw)`;
        }

        function updateReminder() {
            reminderTime = timePicker.value;
            localStorage.setItem('reminderTime', reminderTime);
            alert(`Reminder set to ${reminderTime} daily.`);
        }

        function requestNotification() {
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notification");
            } else if (Notification.permission === "granted") {
                alert("Notifications are already enabled!");
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(function (permission) {
                    if (permission === "granted") {
                        alert("Notifications enabled successfully!");
                    }
                });
            }
        }

        init();
    </script>
</body>
</html>
