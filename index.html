<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 確保手機版比例正確，並禁止雙擊放大干擾按鈕點擊 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 讓 iOS 加入主畫面後隱藏 Safari UI，全螢幕顯示 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Esc.</title>

    <!-- 給 iOS 系統辨識的桌面圖示 -->
    <link rel="apple-touch-icon" href="Esc.-icon.jpg">
    <!-- 給 Android 系統辨識的桌面圖示 -->
    <link rel="icon" type="image/png" href="Esc.-icon.jpg">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            transition: background-color 0.3s ease;
            user-select: none; /* 避免連按按鈕時反白到文字 */
        }
        h1 { font-size: 1.2rem; font-weight: normal; opacity: 0.8; }
        .count { font-size: 6rem; font-weight: bold; margin: 20px 0; }
        .controls { display: flex; gap: 20px; margin-bottom: 40px; }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-tap-highlight-color: transparent; /* 取消手機點擊的預設灰底 */
        }
        button:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }
        .settings { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; opacity: 0.8; }
        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body id="app-body">
    <h1>I don't wanna be here!!!</h1>
    <div class="count" id="countDisplay">0</div>
    
    <div class="controls">
        <button onclick="updateCount(-1)">-</button>
        <button onclick="resetCount()">↺</button>
        <button onclick="updateCount(1)">+</button>
    </div>

    <div class="settings">
        <label for="bgColor">Change color：</label>
        <input type="color" id="bgColor" onchange="updateColor(this.value)">
    </div>

    <script>
        // 初始化：從 LocalStorage 讀取紀錄，若無則給預設值
        let count = parseInt(localStorage.getItem('escapeCount')) || 0;
        let bgColor = localStorage.getItem('escapeBgColor') || '#2C3E50';

        const display = document.getElementById('countDisplay');
        const body = document.getElementById('app-body');
        const colorPicker = document.getElementById('bgColor');

        // 畫面初始渲染
        display.innerText = count;
        body.style.backgroundColor = bgColor;
        colorPicker.value = bgColor;

        // 更新計數
        function updateCount(change) {
            count += change;
            if (count < 0) count = 0; // 避免扣成負數
            display.innerText = count;
            localStorage.setItem('escapeCount', count);
        }

        // 睡前歸零
        function resetCount() {
            count = 0;
            display.innerText = count;
            localStorage.setItem('escapeCount', count);
        }

        // 換背景顏色
        function updateColor(hex) {
            body.style.backgroundColor = hex;
            localStorage.setItem('escapeBgColor', hex);
        }
    </script>
</body>
</html>
